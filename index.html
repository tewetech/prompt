<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Tewe Web Prompt</title>
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/tewetech/favicon/refs/heads/main/prompt.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            tech: {
              300: '#67e8f9',
              400: '#22d3ee',
              500: '#06b6d4',
              600: '#0891b2',
              700: '#0e7490',
              800: '#155e75'
            }
          }
        }
      }
    }
  </script>
  <style>
    :root {
      color-scheme: dark;
    }

    html {
      scroll-behavior: smooth;
      scrollbar-width: thin;
      scrollbar-color: #155e75 #09090b;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      scrollbar-width: thin;
      scrollbar-color: #155e75 #09090b;
    }

    body {
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }

    ::-webkit-scrollbar-track {
      background: #09090b;
    }

    ::-webkit-scrollbar-thumb {
      background: #155e75;
      border-radius: 999px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #0891b2;
    }

    textarea,
    pre,
    code {
      font-family: 'JetBrains Mono', monospace;
    }

    textarea {
      resize: vertical;
      min-width: 0;
      max-width: 100%;
    }

    button,
    textarea {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      touch-action: manipulation;
    }

    .tech-grid {
      background-image:
        linear-gradient(rgba(34, 211, 238, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(34, 211, 238, 0.035) 1px, transparent 1px);
      background-size: 28px 28px;
    }

    .tech-glow {
      background:
        radial-gradient(circle at 50% -10%, rgba(6, 182, 212, 0.11), transparent 36%),
        radial-gradient(circle at 90% 70%, rgba(14, 116, 144, 0.07), transparent 28%);
    }

    .page-shell,
    .page-main,
    .page-card,
    .page-card > div,
    .new-detail,
    .rev-changes,
    .rev-code {
      min-width: 0;
    }

    .page-card {
      width: 100%;
      overflow: hidden;
    }

    .new-detail,
    .rev-changes,
    .rev-code {
      max-width: 100%;
      overflow: auto;
      display: block;
    }

    @media (max-width: 640px) {
      .tech-grid {
        background-size: 24px 24px;
      }
    }

    @media (min-width: 1024px) {
      html,
      body {
        height: 100%;
        overflow: hidden;
      }

      body {
        min-height: 100dvh;
      }

      .page-shell {
        height: 100dvh;
        min-height: 0;
        overflow: hidden;
        padding-top: 1rem !important;
        padding-bottom: 1rem !important;
      }

      .page-header {
        margin-bottom: 0.75rem !important;
        padding-bottom: 0.75rem !important;
      }

      .page-main {
        min-height: 0 !important;
        height: 0;
        width: 100%;
      }

      .page-card {
        min-height: 0 !important;
        height: 100%;
        overflow: hidden;
      }

      .page-card > div {
        min-height: 0;
      }

      .new-detail,
      .rev-changes,
      .rev-code {
        min-height: 0 !important;
        height: 100%;
      }

      .page-footer {
        margin-top: 0.75rem !important;
        padding-top: 0.5rem !important;
      }

      .new-detail {
        flex: 1 1 auto;
      }

      .rev-changes,
      .rev-code {
        flex: 1 1 auto;
      }

      .rev-changes {
        min-height: 0 !important;
      }

      .rev-code {
        min-height: 0 !important;
      }
    }

    @media (max-width: 1023px) {
      .page-card {
        overflow: hidden;
      }

      .new-detail,
      .rev-changes,
      .rev-code {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body class="min-h-dvh bg-[#07090d] text-zinc-100 antialiased selection:bg-cyan-500 selection:text-black flex flex-col tech-grid">
  <div class="fixed inset-0 pointer-events-none tech-glow"></div>

  <div class="page-shell relative z-10 w-full max-w-7xl mx-auto px-4 py-5 sm:px-6 sm:py-7 lg:px-8 flex-1 flex flex-col">
    <header class="page-header mb-6 sm:mb-8 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 border-b border-zinc-800/80 pb-5">
      <div class="min-w-0">
        <div class="inline-flex items-center gap-2 px-2.5 py-1 rounded-full bg-cyan-500/10 border border-cyan-500/20 text-cyan-400 text-xs font-medium mb-2">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m18 16 4-4-4-4"/>
            <path d="m6 8-4 4 4 4"/>
            <path d="m14.5 4-5 16"/>
          </svg>
          AI WEB PROMPT
        </div>

        <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white">
          Tewe Web Prompt
        </h1>

        <p class="text-sm text-zinc-400 mt-1">
          Generator prompt terstruktur untuk pembuatan & revisi website
        </p>
      </div>

      <div class="flex items-center justify-center sm:justify-end gap-2 text-xs text-zinc-500 shrink-0">
        <span class="inline-block w-2 h-2 rounded-full bg-cyan-400"></span>
        Auto Copy Aktif
      </div>
    </header>

    <main class="page-main grid grid-cols-1 lg:grid-cols-2 gap-4 sm:gap-5 flex-1 items-stretch w-full min-w-0">
      <section class="page-card bg-[#0d1117]/95 border border-zinc-800/90 rounded-2xl p-4 sm:p-5 flex flex-col gap-4 shadow-[0_8px_30px_rgba(0,0,0,0.16)] min-h-[420px] lg:min-h-0 min-w-0">
        <div class="flex items-center justify-between gap-3 border-b border-zinc-800/80 pb-3 shrink-0 min-w-0">
          <div class="flex items-center gap-2.5 min-w-0">
            <span class="flex items-center justify-center w-7 h-7 shrink-0 rounded-lg bg-cyan-500/10 text-cyan-400 font-semibold text-xs border border-cyan-500/20">01</span>

            <div class="min-w-0">
              <h2 class="text-lg font-semibold text-white tracking-wide truncate">BUAT WEB</h2>
              <p class="text-xs text-zinc-500 mt-0.5 truncate">Untuk project website baru dari nol</p>
            </div>
          </div>

          <button type="button" onclick="resetNewForm()" class="reset-btn h-8 px-2.5 inline-flex items-center justify-center gap-1.5 rounded-lg border border-zinc-700 bg-zinc-800 text-zinc-400 hover:border-cyan-500/40 hover:text-cyan-400 active:scale-[0.98] transition-colors text-xs font-medium shrink-0">
            Reset
          </button>
        </div>

        <div class="flex flex-col flex-1 gap-4 min-h-0 min-w-0">
          <div class="flex flex-col flex-1 min-h-0 min-w-0">
            <label for="new-detail" class="block text-xs font-medium text-zinc-400 mb-1.5 shrink-0">
              Detail Web Yang Diinginkan <span class="text-cyan-400">*</span>
            </label>

            <textarea
              id="new-detail"
              placeholder="Jelaskan secara detail website yang ingin dibuat..."
              class="new-detail w-full flex-1 min-h-[220px] lg:min-h-0 bg-[#080b10] border border-zinc-800 rounded-xl px-3 py-3 text-sm text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500/30 transition-colors custom-scrollbar"
            ></textarea>
          </div>

          <button type="button" onclick="generateNewPrompt()" class="w-full h-11 inline-flex items-center justify-center gap-2 rounded-xl bg-cyan-600 hover:bg-cyan-500 active:scale-[0.99] text-white text-sm font-medium transition-colors shadow-sm shrink-0">
            <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-1M8 5a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2M8 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2m0 0h2a2 2 0 0 1 2 2v3m2 4H10m0 0 3-3m-3 3 3 3"/>
            </svg>
            <span class="truncate">Generate & Salin</span>
          </button>
        </div>
      </section>

      <section class="page-card bg-[#0d1117]/95 border border-zinc-800/90 rounded-2xl p-4 sm:p-5 flex flex-col gap-4 shadow-[0_8px_30px_rgba(0,0,0,0.16)] min-h-[500px] lg:min-h-0 min-w-0">
        <div class="flex items-center justify-between gap-3 border-b border-zinc-800/80 pb-3 shrink-0 min-w-0">
          <div class="flex items-center gap-2.5 min-w-0">
            <span class="flex items-center justify-center w-7 h-7 shrink-0 rounded-lg bg-cyan-500/10 text-cyan-400 font-semibold text-xs border border-cyan-500/20">02</span>

            <div class="min-w-0">
              <h2 class="text-lg font-semibold text-white tracking-wide truncate">REVISI WEB</h2>
              <p class="text-xs text-zinc-500 mt-0.5 truncate">Untuk memodifikasi kode yang ada</p>
            </div>
          </div>

          <button type="button" onclick="resetRevForm()" class="reset-btn h-8 px-2.5 inline-flex items-center justify-center gap-1.5 rounded-lg border border-zinc-700 bg-zinc-800 text-zinc-400 hover:border-cyan-500/40 hover:text-cyan-400 active:scale-[0.98] transition-colors text-xs font-medium shrink-0">
            Reset
          </button>
        </div>

        <div class="flex flex-col flex-1 gap-4 min-h-0 min-w-0">
          <div class="flex flex-col gap-4 flex-1 min-h-0 min-w-0">
            <div class="flex flex-col flex-1 min-h-[160px] lg:min-h-0 min-w-0">
              <label for="rev-changes" class="block text-xs font-medium text-zinc-400 mb-1.5 shrink-0">
                Perubahan Yang Diinginkan <span class="text-cyan-400">*</span>
              </label>

              <textarea
                id="rev-changes"
                placeholder="Jelaskan bagian mana yang ingin diubah..."
                class="rev-changes w-full flex-1 min-h-[140px] lg:min-h-0 bg-[#080b10] border border-zinc-800 rounded-xl px-3 py-3 text-sm text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500/30 transition-colors custom-scrollbar"
              ></textarea>
            </div>

            <div class="flex flex-col flex-1 min-h-[200px] lg:min-h-0 min-w-0">
              <label for="rev-code" class="block text-xs font-medium text-zinc-400 mb-1.5 shrink-0">
                Source Code HTML <span class="text-zinc-600 font-normal">(Opsional)</span>
              </label>

              <textarea
                id="rev-code"
                placeholder="Tempelkan source code di sini..."
                class="rev-code w-full flex-1 min-h-[180px] lg:min-h-0 bg-[#080b10] border border-zinc-800 rounded-xl px-3 py-3 text-sm text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500/30 transition-colors custom-scrollbar"
              ></textarea>
            </div>
          </div>

          <button type="button" onclick="generateRevisionPrompt()" class="w-full h-11 inline-flex items-center justify-center gap-2 rounded-xl bg-cyan-600 hover:bg-cyan-500 active:scale-[0.99] text-white text-sm font-medium transition-colors shadow-sm mt-auto shrink-0">
            <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-1M8 5a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2M8 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2m0 0h2a2 2 0 0 1 2 2v3m2 4H10m0 0 3-3m-3 3 3 3"/>
            </svg>
            <span class="truncate">Generate & Salin</span>
          </button>
        </div>
      </section>
    </main>

    <footer class="page-footer mt-7 sm:mt-8 pt-4 border-t border-zinc-800/80 text-center text-xs text-zinc-600 shrink-0">
      Generator Prompt &bull; Otomatis Tersalin &bull; Tanpa Refresh
    </footer>
  </div>

  <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-[#111820] border border-cyan-500/20 text-zinc-100 px-4 py-2.5 rounded-xl shadow-lg flex items-center gap-2.5 opacity-0 translate-y-3 pointer-events-none transition-all duration-200 z-50 max-w-[calc(100vw-2rem)]">
    <span id="toast-icon" class="flex items-center justify-center w-5 h-5 rounded-full bg-emerald-500/20 text-emerald-400 shrink-0">
      <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </span>

    <span id="toast-text" class="text-xs sm:text-sm font-medium"></span>
  </div>

  <script>
    let toastTimeout = null;

    function showToast(message, isError = false) {
      clearTimeout(toastTimeout);

      const toast = document.getElementById('toast');
      const toastText = document.getElementById('toast-text');
      const toastIcon = document.getElementById('toast-icon');

      toastText.textContent = message;

      if (isError) {
        toast.classList.remove('border-cyan-500/20');
        toast.classList.add('border-rose-500/30');
        toastIcon.className = 'flex items-center justify-center w-5 h-5 rounded-full bg-rose-500/20 text-rose-400 shrink-0';
        toastIcon.innerHTML = '<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18 18 6M6 6l12 12"></path></svg>';
      } else {
        toast.classList.remove('border-rose-500/30');
        toast.classList.add('border-cyan-500/20');
        toastIcon.className = 'flex items-center justify-center w-5 h-5 rounded-full bg-emerald-500/20 text-emerald-400 shrink-0';
        toastIcon.innerHTML = '<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
      }

      toast.classList.remove('opacity-0', 'translate-y-3', 'pointer-events-none');
      toast.classList.add('opacity-100', 'translate-y-0');

      toastTimeout = setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'translate-y-3', 'pointer-events-none');
      }, 2200);
    }

    async function writeClipboard(text) {
      if (navigator.clipboard && window.isSecureContext) {
        try {
          await navigator.clipboard.writeText(text);
          return true;
        } catch (err) {}
      }

      const textArea = document.createElement('textarea');
      textArea.value = text;
      textArea.style.position = 'fixed';
      textArea.style.left = '-999999px';
      textArea.style.top = '-999999px';
      textArea.setAttribute('aria-hidden', 'true');
      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();

      let success = false;

      try {
        success = document.execCommand('copy');
      } catch (err) {}

      textArea.remove();
      return success;
    }

    function generateNewPrompt() {
      const detail = document.getElementById('new-detail').value.trim();

      if (!detail) {
        showToast('Silakan isi detail web yang diinginkan!', true);
        document.getElementById('new-detail').focus();
        return;
      }

      const prompt = `Buat website dari nol menggunakan HTML + Tailwind CSS + JavaScript dalam SATU file \`index.html\`. 

DETAIL WEB YANG DI INGINKAN :
${detail}

PRIORITAS UTAMA:

* Mobile-first
* Sangat smooth, ringan, responsif
* Optimalkan khusus perangkat mobile
* Jangan gunakan efek yang menyebabkan lag/jank saat scrolling

WAJIB:

* Minimalkan \`backdrop-filter\`, blur, shadow besar, dan animasi berat di mobile
* Gunakan animasi seperlunya dan utamakan \`transform\` + \`opacity\`
* Hindari animasi yang terus berjalan pada banyak elemen sekaligus
* Optimalkan background/image agar tidak menyebabkan repaint berat
* Gunakan \`requestAnimationFrame\` untuk proses yang berjalan saat scroll
* Gunakan passive event listener untuk scroll/touch
* Hindari layout reflow/recalculation berulang
* Jangan melakukan manipulasi DOM berlebihan saat scrolling
* Optimalkan pergantian background agar smooth
* Gunakan ukuran viewport mobile yang stabil (\`svh\`/\`dvh\`) sesuai kebutuhan
* Lazy-load gambar yang tidak langsung terlihat
* Hormati \`prefers-reduced-motion\`
* Pastikan scrolling touch tetap natural dan tidak patah-patah
* Desktop tetap bagus, tetapi performa mobile adalah prioritas utama

FUNGSI DAN FITUR:
Semua fungsi harus tetap lengkap sesuai kebutuhan website.

OUTPUT:

* Full source code
* Hanya satu file \`index.html\`
* HTML + Tailwind CSS + JavaScript menjadi satu
* JANGAN beri komentar di dalam source code
* Jangan membuat file terpisah
* Jangan mengurangi fungsi yang sudah ditentukan`;

      writeClipboard(prompt).then((copied) => {
        if (copied) {
          showToast('Prompt berhasil digenerate & otomatis disalin!');
        } else {
          showToast('Gagal menyalin otomatis. Silakan coba lagi.', true);
        }
      });
    }

    function generateRevisionPrompt() {
      const changes = document.getElementById('rev-changes').value.trim();
      const code = document.getElementById('rev-code').value.trim();

      if (!changes) {
        showToast('Silakan isi perubahan yang diinginkan!', true);
        document.getElementById('rev-changes').focus();
        return;
      }

      let prompt = `Saya akan melampirkan source code HTML yang sudah ada.

TUGAS:
Revisi source code tersebut sesuai perubahan yang saya minta, tetapi WAJIB mempertahankan seluruh fungsi, fitur, struktur kerja, dan perilaku yang sudah ada kecuali bagian yang secara eksplisit saya minta untuk diubah.

PRIORITAS UTAMA:

* Mobile-first
* Sangat smooth, ringan, dan responsif
* Optimalkan khusus perangkat mobile
* Scrolling harus natural, stabil, tanpa lag/jank
* Desktop tetap bagus dan responsif, tetapi performa mobile adalah prioritas utama

PERFORMA WAJIB:

* Minimalkan \`backdrop-filter\`, blur, shadow besar, dan animasi berat terutama di mobile
* Gunakan animasi seperlunya, prioritaskan \`transform\` dan \`opacity\`
* Hindari animasi terus-menerus pada banyak elemen
* Optimalkan background/image agar tidak menyebabkan repaint berat
* Gunakan \`requestAnimationFrame\` untuk proses yang berkaitan dengan scroll
* Gunakan passive event listener untuk scroll/touch
* Hindari layout reflow/recalculation berulang
* Jangan melakukan manipulasi DOM berlebihan saat scrolling
* Optimalkan pergantian background agar transisinya smooth
* Gunakan \`svh\`/\`dvh\` sesuai kebutuhan agar viewport mobile stabil
* Gunakan lazy-loading untuk gambar yang tidak langsung terlihat
* Hormati \`prefers-reduced-motion\`
* Jangan menggunakan efek visual yang mengorbankan performa
* Pastikan touch scrolling tetap natural dan tidak patah-patah
* Hindari JavaScript yang berjalan terus-menerus jika tidak diperlukan
* Jangan membuat interval, listener, observer, atau animasi baru yang redundant
* Pastikan elemen tidak mengalami flicker, jumping, shifting, atau glitch saat scrolling

ATURAN REVISI:

* Jangan menghapus fungsi yang sudah ada
* Jangan mengurangi fitur yang sudah ada
* Jangan mengubah alur kerja yang tidak saya minta
* Jangan mengubah data/content yang tidak saya minta
* Jangan mengubah desain yang tidak saya minta
* Jangan mengganti library yang sudah digunakan tanpa alasan kuat
* Pertahankan semua ID, class, event, fungsi JavaScript, dan mekanisme yang masih diperlukan
* Jika perubahan membutuhkan modifikasi kode lama, lakukan seminimal mungkin
* Pastikan fitur lama tetap bekerja setelah revisi
* Jangan membuat solusi yang hanya bagus di desktop tetapi buruk di mobile
* Prioritaskan performa nyata di perangkat mobile, bukan hanya tampilan

FUNGSI DAN FITUR:
Semua fungsi dan fitur harus tetap lengkap sesuai source code awal dan kebutuhan revisi.

OUTPUT:

* Berikan FULL SOURCE CODE
* Hanya satu file \`index.html\`
* HTML + Tailwind CSS + JavaScript dalam satu file
* Jangan membuat file tambahan
* Jangan memberikan potongan kode
* Jangan memberikan placeholder
* Jangan menghilangkan bagian kode yang masih diperlukan
* JANGAN beri komentar apa pun di dalam source code
* Source code harus siap langsung digunakan

SEBELUM MEMBERIKAN HASIL:
Pastikan secara internal bahwa:

1. Semua fitur lama tetap tersedia
2. Semua perubahan yang saya minta sudah diterapkan
3. Tidak ada fungsi JavaScript yang rusak
4. Tidak ada event listener redundant
5. Tidak ada animasi berat yang tidak diperlukan
6. Scrolling mobile tetap smooth
7. Layout tidak mengalami reflow berlebihan
8. Tampilan mobile dan desktop tetap responsif
9. Tidak ada bagian penting yang terhapus

PERUBAHAN YANG SAYA INGINKAN:
${changes}

SOURCE CODE YANG AKAN DIREVISI:`;

      if (code) {
        prompt += `
\`\`\`html
${code}
\`\`\``;
      } else {
        prompt += ` `;
      }

      writeClipboard(prompt).then((copied) => {
        if (copied) {
          showToast('Prompt revisi berhasil digenerate & otomatis disalin!');
        } else {
          showToast('Gagal menyalin otomatis. Silakan coba lagi.', true);
        }
      });
    }

    function resetNewForm() {
      document.getElementById('new-detail').value = '';
      document.getElementById('new-detail').focus();
    }

    function resetRevForm() {
      document.getElementById('rev-changes').value = '';
      document.getElementById('rev-code').value = '';
      document.getElementById('rev-changes').focus();
    }
  </script>
</body>
</html>
