<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AI Web Prompt Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    pre, code, textarea {
      font-family: 'JetBrains Mono', monospace;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #3f3f46;
      border-radius: 9999px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #52525b;
    }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-[100svh] flex flex-col antialiased selection:bg-zinc-100 selection:text-zinc-900">

  <header class="border-b border-zinc-900 bg-zinc-950 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3.5">
        <div class="w-10 h-10 rounded-xl bg-zinc-100 flex items-center justify-center shadow-lg">
          <svg class="w-5 h-5 text-zinc-950" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13 10V3L4 14h7v7l9-11h-7z"/>
          </svg>
        </div>
        <div>
          <h1 class="text-base sm:text-lg font-bold tracking-tight text-white flex items-center gap-2">
            AI Prompt Generator
            <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-zinc-800 text-zinc-300 tracking-wide uppercase">Single File</span>
          </h1>
          <p class="text-xs text-zinc-400 font-medium mt-0.5">Generator prompt terstruktur untuk pembuatan & revisi website</p>
        </div>
      </div>
      <div class="flex items-center gap-2 text-[11px] font-medium text-zinc-400 bg-zinc-900/50 px-3 py-1.5 rounded-lg border border-zinc-800">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
        Auto Copy Aktif
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 flex flex-col">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 sm:gap-6 items-stretch flex-1">

      <section class="bg-zinc-900 rounded-2xl border border-zinc-800/80 p-5 sm:p-7 flex flex-col shadow-xl">
        <div class="flex items-center justify-between pb-4 mb-4 border-b border-zinc-800/80">
          <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-lg bg-zinc-800 text-white flex items-center justify-center font-bold text-sm">
              1
            </div>
            <div>
              <h2 class="text-base font-bold text-white">Buat Prompt Baru</h2>
              <p class="text-xs text-zinc-400">Untuk project website baru dari nol</p>
            </div>
          </div>
          <button type="button" onclick="resetNewForm()" class="text-xs font-semibold text-zinc-400 hover:text-white px-3 py-1.5 rounded-lg bg-zinc-950 border border-zinc-800 hover:border-zinc-700 transition-colors">
            Reset
          </button>
        </div>

        <div class="flex flex-col flex-1 gap-5">
          <div class="flex-1 flex flex-col">
            <label for="new-detail" class="block text-xs font-bold uppercase tracking-wider text-zinc-300 mb-2">
              Detail Web Yang Diinginkan <span class="text-rose-400">*</span>
            </label>
            <textarea 
              id="new-detail" 
              placeholder="Jelaskan secara detail website yang ingin dibuat..." 
              class="w-full flex-1 min-h-[200px] bg-zinc-950 border border-zinc-800 focus:border-zinc-500 focus:ring-1 focus:ring-zinc-500 rounded-xl p-4 text-sm text-zinc-100 placeholder-zinc-600 outline-none transition-all resize-none custom-scrollbar"
            ></textarea>
          </div>

          <button 
            type="button" 
            onclick="generateNewPrompt()" 
            class="w-full bg-white hover:bg-zinc-200 active:scale-[0.98] text-zinc-950 font-bold py-3.5 px-4 rounded-xl text-sm flex items-center justify-center gap-2 transition-all"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/>
            </svg>
            Generate & Salin Prompt Baru
          </button>
        </div>
      </section>

      <section class="bg-zinc-900 rounded-2xl border border-zinc-800/80 p-5 sm:p-7 flex flex-col shadow-xl">
        <div class="flex items-center justify-between pb-4 mb-4 border-b border-zinc-800/80">
          <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-lg bg-zinc-800 text-white flex items-center justify-center font-bold text-sm">
              2
            </div>
            <div>
              <h2 class="text-base font-bold text-white">Buat Prompt Revisi</h2>
              <p class="text-xs text-zinc-400">Untuk memodifikasi kode yang ada</p>
            </div>
          </div>
          <button type="button" onclick="resetRevForm()" class="text-xs font-semibold text-zinc-400 hover:text-white px-3 py-1.5 rounded-lg bg-zinc-950 border border-zinc-800 hover:border-zinc-700 transition-colors">
            Reset
          </button>
        </div>

        <div class="flex flex-col flex-1 gap-5">
          <div class="flex-1 flex flex-col gap-4">
            <div class="flex flex-col flex-1">
              <label for="rev-changes" class="block text-xs font-bold uppercase tracking-wider text-zinc-300 mb-2">
                Perubahan Yang Diinginkan <span class="text-rose-400">*</span>
              </label>
              <textarea 
                id="rev-changes" 
                placeholder="Jelaskan bagian mana yang ingin diubah..." 
                class="w-full flex-1 min-h-[100px] bg-zinc-950 border border-zinc-800 focus:border-zinc-500 focus:ring-1 focus:ring-zinc-500 rounded-xl p-4 text-sm text-zinc-100 placeholder-zinc-600 outline-none transition-all resize-none custom-scrollbar"
              ></textarea>
            </div>

            <div class="flex flex-col flex-1">
              <label for="rev-code" class="block text-xs font-bold uppercase tracking-wider text-zinc-300 mb-2">
                Source Code HTML <span class="text-zinc-500 font-medium">(Opsional)</span>
              </label>
              <textarea 
                id="rev-code" 
                placeholder="Tempelkan source code di sini..." 
                class="w-full flex-1 min-h-[100px] bg-zinc-950 border border-zinc-800 focus:border-zinc-500 focus:ring-1 focus:ring-zinc-500 rounded-xl p-4 text-sm text-zinc-100 placeholder-zinc-600 outline-none transition-all resize-none custom-scrollbar"
              ></textarea>
            </div>
          </div>

          <button 
            type="button" 
            onclick="generateRevisionPrompt()" 
            class="w-full bg-white hover:bg-zinc-200 active:scale-[0.98] text-zinc-950 font-bold py-3.5 px-4 rounded-xl text-sm flex items-center justify-center gap-2 transition-all mt-auto"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/>
            </svg>
            Generate & Salin Prompt Revisi
          </button>
        </div>
      </section>

    </div>
  </main>

  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 translate-y-4 transition-all duration-300 max-w-[90vw] sm:max-w-md w-full">
    <div id="toast-box" class="bg-zinc-900 border border-zinc-700 text-white px-4 py-3.5 rounded-xl shadow-2xl flex items-center gap-3">
      <div id="toast-icon" class="w-7 h-7 rounded-full bg-white text-zinc-900 flex items-center justify-center shrink-0">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
        </svg>
      </div>
      <p id="toast-text" class="text-xs sm:text-sm font-semibold tracking-wide"></p>
    </div>
  </div>

  <footer class="border-t border-zinc-900 py-5 px-4 text-center text-[11px] font-semibold text-zinc-500 uppercase tracking-widest mt-auto">
    Generator Prompt &bull; Otomatis Tersalin &bull; Tanpa Refresh
  </footer>

  <script>
    let toastTimeout;

    function showToast(message, isError = false) {
      clearTimeout(toastTimeout);
      const toast = document.getElementById('toast');
      const toastBox = document.getElementById('toast-box');
      const toastIcon = document.getElementById('toast-icon');
      const toastText = document.getElementById('toast-text');

      toastText.textContent = message;

      if (isError) {
        toastBox.className = 'bg-rose-950 border border-rose-800 text-white px-4 py-3.5 rounded-xl shadow-2xl flex items-center gap-3';
        toastIcon.className = 'w-7 h-7 rounded-full bg-rose-500 text-white flex items-center justify-center shrink-0';
        toastIcon.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/></svg>';
      } else {
        toastBox.className = 'bg-zinc-900 border border-zinc-700 text-white px-4 py-3.5 rounded-xl shadow-2xl flex items-center gap-3';
        toastIcon.className = 'w-7 h-7 rounded-full bg-white text-zinc-900 flex items-center justify-center shrink-0';
        toastIcon.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>';
      }

      toast.classList.remove('opacity-0', 'translate-y-4');
      toast.classList.add('opacity-100', 'translate-y-0');

      toastTimeout = setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'translate-y-4');
      }, 2600);
    }

    async function writeClipboard(text) {
      if (navigator.clipboard && window.isSecureContext) {
        try {
          await navigator.clipboard.writeText(text);
          return true;
        } catch (err) {}
      }
      const textArea = document.createElement("textarea");
      textArea.value = text;
      textArea.style.position = "fixed";
      textArea.style.left = "-999999px";
      textArea.style.top = "-999999px";
      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();
      let success = false;
      try {
        success = document.execCommand('copy');
      } catch (err) {}
      textArea.remove();
      return success;
    }

    function generateNewPrompt() {
      const detail = document.getElementById('new-detail').value.trim();

      if (!detail) {
        showToast('Silakan isi detail web yang diinginkan!', true);
        document.getElementById('new-detail').focus();
        return;
      }

      const prompt = `Buat website dari nol menggunakan HTML + Tailwind CSS + JavaScript dalam SATU file \`index.html\`. 
 
DETAIL WEB YANG DI INGINKAN :
${detail}

PRIORITAS UTAMA:

* Mobile-first
* Sangat smooth, ringan, responsif
* Optimalkan khusus perangkat mobile
* Jangan gunakan efek yang menyebabkan lag/jank saat scrolling

WAJIB:

* Minimalkan \`backdrop-filter\`, blur, shadow besar, dan animasi berat di mobile
* Gunakan animasi seperlunya dan utamakan \`transform\` + \`opacity\`
* Hindari animasi yang terus berjalan pada banyak elemen sekaligus
* Optimalkan background/image agar tidak menyebabkan repaint berat
* Gunakan \`requestAnimationFrame\` untuk proses yang berjalan saat scroll
* Gunakan passive event listener untuk scroll/touch
* Hindari layout reflow/recalculation berulang
* Jangan melakukan manipulasi DOM berlebihan saat scrolling
* Optimalkan pergantian background agar smooth
* Gunakan ukuran viewport mobile yang stabil (\`svh\`/\`dvh\`) sesuai kebutuhan
* Lazy-load gambar yang tidak langsung terlihat
* Hormati \`prefers-reduced-motion\`
* Pastikan scrolling touch tetap natural dan tidak patah-patah
* Desktop tetap bagus, tetapi performa mobile adalah prioritas utama

FUNGSI DAN FITUR:
Semua fungsi harus tetap lengkap sesuai kebutuhan website.

OUTPUT:

* Full source code
* Hanya satu file \`index.html\`
* HTML + Tailwind CSS + JavaScript menjadi satu
* JANGAN beri komentar di dalam source code
* Jangan membuat file terpisah
* Jangan mengurangi fungsi yang sudah ditentukan`;

      writeClipboard(prompt).then((copied) => {
        if (copied) {
          showToast('Prompt berhasil digenerate & otomatis disalin!');
        } else {
          showToast('Gagal menyalin otomatis. Silakan coba lagi.', true);
        }
      });
    }

    function generateRevisionPrompt() {
      const changes = document.getElementById('rev-changes').value.trim();
      const code = document.getElementById('rev-code').value.trim();

      if (!changes) {
        showToast('Silakan isi perubahan yang diinginkan!', true);
        document.getElementById('rev-changes').focus();
        return;
      }

      let prompt = `Saya akan melampirkan source code HTML yang sudah ada.

TUGAS:
Revisi source code tersebut sesuai perubahan yang saya minta, tetapi WAJIB mempertahankan seluruh fungsi, fitur, struktur kerja, dan perilaku yang sudah ada kecuali bagian yang secara eksplisit saya minta untuk diubah.

PRIORITAS UTAMA:

* Mobile-first
* Sangat smooth, ringan, dan responsif
* Optimalkan khusus perangkat mobile
* Scrolling harus natural, stabil, tanpa lag/jank
* Desktop tetap bagus dan responsif, tetapi performa mobile adalah prioritas utama

PERFORMA WAJIB:

* Minimalkan \`backdrop-filter\`, blur, shadow besar, dan animasi berat terutama di mobile
* Gunakan animasi seperlunya, prioritaskan \`transform\` dan \`opacity\`
* Hindari animasi terus-menerus pada banyak elemen
* Optimalkan background/image agar tidak menyebabkan repaint berat
* Gunakan \`requestAnimationFrame\` untuk proses yang berkaitan dengan scroll
* Gunakan passive event listener untuk scroll/touch
* Hindari layout reflow/recalculation berulang
* Jangan melakukan manipulasi DOM berlebihan saat scrolling
* Optimalkan pergantian background agar transisinya smooth
* Gunakan \`svh\`/\`dvh\` sesuai kebutuhan agar viewport mobile stabil
* Gunakan lazy-loading untuk gambar yang tidak langsung terlihat
* Hormati \`prefers-reduced-motion\`
* Jangan menggunakan efek visual yang mengorbankan performa
* Pastikan touch scrolling tetap natural dan tidak patah-patah
* Hindari JavaScript yang berjalan terus-menerus jika tidak diperlukan
* Jangan membuat interval, listener, observer, atau animasi baru yang redundant
* Pastikan elemen tidak mengalami flicker, jumping, shifting, atau glitch saat scrolling

ATURAN REVISI:

* Jangan menghapus fungsi yang sudah ada
* Jangan mengurangi fitur yang sudah ada
* Jangan mengubah alur kerja yang tidak saya minta
* Jangan mengubah data/content yang tidak saya minta
* Jangan mengubah desain yang tidak saya minta
* Jangan mengganti library yang sudah digunakan tanpa alasan kuat
* Pertahankan semua ID, class, event, fungsi JavaScript, dan mekanisme yang masih diperlukan
* Jika perubahan membutuhkan modifikasi kode lama, lakukan seminimal mungkin
* Pastikan fitur lama tetap bekerja setelah revisi
* Jangan membuat solusi yang hanya bagus di desktop tetapi buruk di mobile
* Prioritaskan performa nyata di perangkat mobile, bukan hanya tampilan

FUNGSI DAN FITUR:
Semua fungsi dan fitur harus tetap lengkap sesuai source code awal dan kebutuhan revisi.

OUTPUT:

* Berikan FULL SOURCE CODE
* Hanya satu file \`index.html\`
* HTML + Tailwind CSS + JavaScript dalam satu file
* Jangan membuat file tambahan
* Jangan memberikan potongan kode
* Jangan memberikan placeholder
* Jangan menghilangkan bagian kode yang masih diperlukan
* JANGAN beri komentar apa pun di dalam source code
* Source code harus siap langsung digunakan

SEBELUM MEMBERIKAN HASIL:
Pastikan secara internal bahwa:

1. Semua fitur lama tetap tersedia
2. Semua perubahan yang saya minta sudah diterapkan
3. Tidak ada fungsi JavaScript yang rusak
4. Tidak ada event listener redundant
5. Tidak ada animasi berat yang tidak diperlukan
6. Scrolling mobile tetap smooth
7. Layout tidak mengalami reflow berlebihan
8. Tampilan mobile dan desktop tetap responsif
9. Tidak ada bagian penting yang terhapus

PERUBAHAN YANG SAYA INGINKAN:
${changes}

SOURCE CODE YANG AKAN DIREVISI:`;

      if (code) {
        prompt += `\n\`\`\`html\n${code}\n\`\`\``;
      } else {
        prompt += ` `;
      }

      writeClipboard(prompt).then((copied) => {
        if (copied) {
          showToast('Prompt revisi berhasil digenerate & otomatis disalin!');
        } else {
          showToast('Gagal menyalin otomatis. Silakan coba lagi.', true);
        }
      });
    }

    function resetNewForm() {
      document.getElementById('new-detail').value = '';
    }

    function resetRevForm() {
      document.getElementById('rev-changes').value = '';
      document.getElementById('rev-code').value = '';
    }
  </script>
</body>
</html>
